name: Verify
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Verify
      run: |
        echo "::add-matcher::.github/workflows/verify.json"
        perl .github/workflows/verify.pl
